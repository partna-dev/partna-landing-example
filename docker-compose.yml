services:
  web:
    build: .
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_BASE: http://localhost:8787
      PUBLIC_ROBOTS: index
    depends_on:
      - mock

  mock:
    image: node:22-alpine
    working_dir: /app
    command: node mock-backend/server.mjs
    volumes:
      - .:/app:ro
    ports:
      - "8787:8787"
